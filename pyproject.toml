[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "world-engine-client"
version = "0.6.0"
description = "Remote Gym-style Python client for a World Engine simulation server: connect(token) -> reset/step over HTTP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Xiatao Sun", email = "sunxiatao@gmail.com" }]
keywords = ["robotics", "simulation", "gymnasium", "gaussian-splatting", "real2sim"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
img = ["Pillow>=10"]
gym = ["gymnasium>=1.0"]
# Camera images, rendered on this machine in headless Chrome. Without an
# installed Chrome, Playwright's Chromium downloads on first use.
render = ["Pillow>=10", "playwright>=1.40", "websockets>=12"]

[dependency-groups]
dev = ["pytest>=8", "ruff", "Pillow>=10", "gymnasium>=1.0"]

[project.urls]
Homepage = "https://github.com/Grounded-Intelligence-Initiative/world-engine-client-python"
Repository = "https://github.com/Grounded-Intelligence-Initiative/world-engine-client-python"

[tool.hatch.build.targets.wheel]
packages = ["src/world_engine_client"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
