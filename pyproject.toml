[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "world-engine"
version = "0.1.0"
description = "Remote Gym-style Python client for a World Engine simulation server: connect(token) -> reset/step over HTTP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "World Engine Contributors" }]
keywords = ["robotics", "simulation", "gymnasium", "gaussian-splatting", "real2sim"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/Grounded-Intelligence-Initiative/world-engine-python"
Repository = "https://github.com/Grounded-Intelligence-Initiative/world-engine-python"

[tool.hatch.build.targets.wheel]
packages = ["src/we_client"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
