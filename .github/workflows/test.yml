name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # cryptography: the cache and DAC1 tests run here too, without a renderer.
      # h5py: the recording realign tests write HDF5 files. No extra installs
      # it; the render jobs below go without it, and there those tests skip.
      - run: pip install -e '.[img,gym]' pytest ruff cryptography h5py
      - run: ruff check .
      - run: python -m pytest

  # world-engine-swiftshader for the render jobs, built from its pinned sources the
  # way publish-swiftshader.yml builds the release (cached by those sources). The
  # render extra depends on it on Linux, so pip finds it here before PyPI has it.
  swiftshader:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: cache
        uses: actions/cache@v4
        with:
          path: swiftshader/src/world_engine_swiftshader/lib
          key: sws-x86_64-${{ hashFiles('swiftshader/sources.env', 'swiftshader/scripts/build.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: swiftshader/scripts/build.sh "$RUNNER_TEMP/sws" "$(nproc)"
      - run: pip install build && python -m build --wheel swiftshader -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: swiftshader-x86_64
          path: dist/*.whl

  # The CPU tier: renderer D on Mesa's lavapipe (the runners have no GPU), and the
  # browser path in a real headless Chrome, on every supported Python.
  render:
    needs: swiftshader
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: swiftshader-x86_64
          path: dist
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libvulkan1 mesa-vulkan-drivers
      - run: pip install dist/world_engine_swiftshader-*.whl && pip install -e '.[render,gym]' pytest
      - run: python -c "from world_engine_client import render, render_wgsl; assert render.available() and render_wgsl.available()"
      # The browser path's own headless shell, downloaded where the client
      # keeps it (not Playwright's directory), and Chromium's system libraries.
      # WE_TEST_BROWSER=shell: the real-Chrome tests use it, not the runner's Chrome.
      - run: echo "DIGIARENA_BROWSERS_DIR=$RUNNER_TEMP/browsers" >> "$GITHUB_ENV"
      - run: python -m playwright install-deps chromium
      - run: python -m world_engine_client.render install
      - run: python -m pytest
        env:
          WE_TEST_BROWSER: shell
          WE_TEST_REQUIRE_CHROME: "1"
          WE_TEST_REQUIRE_WGSL: "1"
          WE_TEST_EXPECT_ADAPTER: lavapipe

  # Renderer D with nothing but the bundled software Vulkan: no system loader, no
  # driver (a minimal system, a container without libvulkan1).
  render-swiftshader:
    needs: swiftshader
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: swiftshader-x86_64
          path: dist
      - name: no system Vulkan
        run: |
          sudo apt-get purge -y -q libvulkan1 mesa-vulkan-drivers || true
          if python -c "import ctypes; ctypes.CDLL('libvulkan.so.1')" 2>/dev/null; then
            echo "a system Vulkan loader is still there"; exit 1
          fi
      - run: pip install dist/world_engine_swiftshader-*.whl && pip install -e '.[render,gym]' pytest
      - run: python -m pytest tests/test_render_wgsl.py tests/test_wgsl_vendored.py tests/test_bench_igpu.py
        env:
          WE_TEST_REQUIRE_WGSL: "1"
          WE_TEST_EXPECT_ADAPTER: swiftshader
